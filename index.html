<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ===== BASE LAYOUT ===== */
    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #f5f5f5;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    }

    .document {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ===== A4 PAGE ===== */
    .a4-page {
      width: 210mm;
      height: 297mm;
      position: relative;
      background-color: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .cover-page {
      background-image: url('https://softcat.sharepoint.com/sites/SAMTechnical/Shared%20Documents/SAMSYNC%20Assets/background2.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .white-page {
      background-color: white;
    }

    /* ===== PAGE HEADER ===== */
    .page-header {
      padding: 24px 30px 0;
    }

    .logo-header {
      width: 4.8cm;
      height: 1.49cm;
      object-fit: contain;
      display: block;
    }

    .page-content {
      padding: 24px 30px 30px;
      min-height: calc(297mm - 80px);
    }

    /* ===== COVER CONTENT ===== */
    .cover-content {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .cover-customer,
    .cover-meta {
      color: white;
    }

    .cover-title {
      position: absolute;
      top: 48%;
      left: 52%;
      transform: translate(-50%, -50%);
      text-align: right;
      font-size: 36px;
      font-weight: 600;
      font-family: Avenir Next LT Pro Demi (Headings);
      width: 80%;
      white-space: nowrap;
      color: black;
    }

    .cover-customer {
      position: absolute;
      top: 41%;
      left: 52%;
      transform: translateX(-50%);
      text-align: right;
      font-size: 36px;
      font-weight: 600;
      font-family: Avenir Next LT Pro Demi (Headings);
      width: 80%;
    }

    .cover-meta {
      position: absolute;
      top: 55%;
      left: 76%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: auto auto;
      gap: 12px 30px;
      min-width: 250px;
      text-align: right;
    }

    .meta-item {
      display: grid;
      gap: 4px;
      align-items: end;
    }

    .meta-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.7);
    }

    .meta-value {
      font-size: 1rem;
      color: white;
      font-weight: 500;
    }

    /* ===== PAGE CONTENT ===== */
    .page-content .content-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 16px;
      color: black;
    }

    .page-content .content-paragraph {
      margin-bottom: 16px;
    }

    .Server-Table {
      margin-top: 16px;
      width: 100%;
      border-collapse: collapse;
    }

    .Server-Table th,
    .Server-Table td {
      padding: 8px;
      border: 1px solid #ddd;
      text-align: left;
    }

    .Server-Table thead {
      background-color: #f9f9f9;
    }

    /* ===== PREVIEW MODE ===== */
    /* Only apply white text to cover page preview elements */
    .preview .cover-content .preview-active {
      color: white;
    }

    /* All other content remains black in preview mode */
    .preview .page-content .preview-active {
      color: black;
    }

    /* ===== PRINT SUPPORT ===== */
    @media print {
      body {
        padding: 0;
        background: white;
      }

      .a4-page {
        width: 100%;
        height: 100%;
        box-shadow: none;
      }
    }
  </style>
  <!-- <script src="script.js" defer></script> -->
</head>

<!-- ✅ ENABLE PREVIEW MODE HERE -->
<body class="preview">
  <div class="document">
    <div class="a4-page cover-page">
      <div class="cover-content">

        <!-- TITLE -->
        <div class="cover-title" data-field="document_title" data-preview="Snow Atlas Health Check">
          {{document_title}}
        </div>

        <!-- CUSTOMER -->
        <div class="cover-customer" data-field="customer_name" data-preview="Contoso Ltd">
          {{customer_name}}
        </div>

        <!-- METADATA GRID -->
        <div class="cover-meta">

        <div class="meta-item">
          <div class="meta-label">Author</div>
          <div class="meta-value" data-field="consultant_name" data-preview="Owen Harrison">
            {{consultant_name}}
          </div>
        </div>

        <div class="meta-item">
          <div class="meta-label">Date</div>
          <div class="meta-value" data-field="document_date" data-preview="11/06/2026">
            {{document_date}}
          </div>
        </div>

        <div class="meta-item">
          <div class="meta-label">Version</div>
          <div class="meta-value" data-field="document_version" data-preview="2.0">
            {{document_version}}
          </div>
        </div>

        <div class="meta-item">
          <div class="meta-label">Sensitivity</div>
          <div class="meta-value" data-field="document_sensitivity" data-preview="External">
            {{document_sensitivity}}
          </div>
        </div>

      </div>

      </div>
    </div>

    <div class="a4-page white-page">
      <div class="page-header">
        <img class="logo-header" src="https://softcat.sharepoint.com/sites/SAMTechnical/Shared%20Documents/SAMSYNC%20Assets/Logo.png" alt="Document Logo Header" />
      </div>
      <div class="page-content">
          <h1 class="content-title" data-field="section_1_title" data-preview="Section 1: Executive Summary">
            {{section_1_title}}
          </h1>
          <p class="content-paragraph" data-field="section_1_paragraph" data-preview="This is the executive summary paragraph. It provides a brief overview of the document's key findings and recommendations.">
            {{section_1_paragraph}}
          </p>
          <table class="Server-Table">
            <thead>
              <tr>
                <th>Server Name</th>
                <th>Server Purpose</th>
                <th>Application Version</th>
              </tr>
            </thead>
            <tbody>
              {{servers_rows}}
            </tbody>
            <!--
            <tbody class="preview-rows">
              <tr>
                <td>Server 1</td>
                <td>Snow Gateway</td>
                <td>1.0.0</td>
              </tr>

              <tr>
                <td>Server 2</td>
                <td>Snow License Manager</td>
                <td>1.0.0</td>
              </tr>
            </tbody>
            -->>
          </table>
      </div>
    </div>
  </div>
</body>
</html>
